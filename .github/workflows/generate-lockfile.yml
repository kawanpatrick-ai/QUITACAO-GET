name: Generate npm lockfile
on:
  push:
    branches:
      - chore/npm-lockfile
permissions:
  contents: write
jobs:
  generate-and-verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/npm-lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Next.js build
        run: npm run build
      - name: Cloudflare OpenNext build
        run: npm run cf:build
      - name: Commit lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-lockfile.yml
          git add package-lock.json
          git commit -m "chore: commit npm lockfile"
          git push origin HEAD:refs/heads/chore/npm-lockfile
